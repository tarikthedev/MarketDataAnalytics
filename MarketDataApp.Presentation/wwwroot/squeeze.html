<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıkışma Analizi (Volatility Squeeze)</title>
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            height: 100vh;
            overflow: hidden;
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 20px;
            margin: 0 auto 15px auto;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .filter-group {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background: #1e222d;
            border: 1px solid #363c4e;
            color: #787b86;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }

            .filter-btn:hover, .filter-btn.active {
                background: #2962ff;
                border-color: #2962ff;
                color: #fff;
            }

        .search-input {
            background: #1e222d;
            border: 1px solid #363c4e;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            width: 220px;
        }

            .search-input:focus {
                border-color: #2962ff;
            }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            padding: 0 20px 20px 20px;
            overflow-y: auto;
            flex: 1;
        }

        .squeeze-card {
            background: #1e222d;
            border: 1px solid #363c4e;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

            .squeeze-card:hover {
                transform: translateY(-2px);
                border-color: #5d657d;
            }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e39;
            padding-bottom: 10px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .card-category {
            font-size: 11px;
            color: #787b86;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .badge-hot {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
            border: 1px solid #ff9800;
        }

        .badge-normal {
            background: rgba(255, 255, 255, 0.05);
            color: #787b86;
        }

        .tf-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .tf-box {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .tf-box.squeezed {
                border-color: #ff9800;
                background: rgba(255, 152, 0, 0.05);
            }

        .tf-name {
            font-size: 13px;
            font-weight: 700;
            color: #d1d4dc;
        }

        .tf-pct {
            font-size: 12px;
            font-weight: 600;
        }

            .tf-pct.low {
                color: #ff9800;
            }

            .tf-pct.high {
                color: #787b86;
            }

        .tf-duration {
            font-size: 10px;
            font-weight: 600;
            color: #ef5350;
            background: rgba(239, 83, 80, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .card-action {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
        }

        .btn-trade {
            background: transparent;
            border: 1px solid #363c4e;
            color: #d1d4dc;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

            .btn-trade:hover {
                background: #2962ff;
                border-color: #2962ff;
                color: #fff;
            }

        .cards-container::-webkit-scrollbar {
            width: 6px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: #363c4e;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="nav-wrapper-container">
        <div class="nav-wrapper">
            <nav class="main-nav">
                <a href="/index.html">Canlı Grafik</a>
                <a href="/cot.html">COT Analizi</a>
                <a href="/seasonality.html">Mevsimsellik</a>
                <a href="/squeeze.html" class="active">Sıkışma</a>
                <a href="/calendar.html">Ekonomik Takvim</a>
                <a href="/ai-agent.html">AI Makro Ajanı</a>
            </nav>
        </div>
    </div>

    <div class="header-bar">
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">Tümü</button>
            <button class="filter-btn" data-filter="squeezed">🔥 Sıkışanlar</button>
            <button class="filter-btn" data-filter="Forex">Forex</button>
            <button class="filter-btn" data-filter="Metals">Metaller</button>
            <button class="filter-btn" data-filter="Crypto">Kripto</button>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="Parite ara (Örn: XAUUSD)...">
    </div>

    <div id="cardsContainer" class="cards-container">
        <p style="color: #787b86; padding: 20px;">Zaman dilimleri taranıyor, lütfen bekleyiniz...</p>
    </div>

    <script>
        let allData = [];
        let currentFilter = 'all';

        async function fetchSqueezeData() {
            try {
                const res = await fetch('/api/squeeze');
                allData = await res.json();
                renderCards();
            } catch (e) {
                document.getElementById('cardsContainer').innerHTML =
                    `<p style="color:#ef5350;">Veri yüklenirken hata oluştu: ${e.message}</p>`;
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const search = document.getElementById('searchInput').value.toUpperCase();

            const filtered = allData.filter(item => {
                const sym = (item.symbol || item.Symbol || "").toUpperCase();
                const nm = (item.name || item.Name || "").toUpperCase();

                const matchSearch = sym.includes(search) || nm.includes(search);
                if (!matchSearch) return false;

                const category = item.category || item.Category || "";
                const squeezedCount = item.squeezedTfCount || item.SqueezedTfCount || 0;

                if (currentFilter === 'all') return true;
                if (currentFilter === 'squeezed') return squeezedCount > 0;
                return category === currentFilter;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: #787b86; padding: 20px;">Filtreye uygun piyasa bulunamadı.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const squeezedCount = item.squeezedTfCount || item.SqueezedTfCount || 0;
                const timeframes = item.timeframes || item.Timeframes || [];
                const sym = item.symbol || item.Symbol || "";
                const nm = item.name || item.Name || "";

                let badgeHtml = `<span class="badge badge-normal">NORMAL</span>`;
                if (squeezedCount >= 2) {
                    badgeHtml = `<span class="badge badge-hot">🔥 ${squeezedCount}/4 MTF SIKIŞMA</span>`;
                } else if (squeezedCount === 1) {
                    badgeHtml = `<span class="badge badge-hot">SIKIŞMA</span>`;
                }

                const tfBoxes = timeframes.map(tf => {
                    const isSqueezed = tf.isSqueezed || tf.IsSqueezed;
                    const timeframe = tf.timeframe || tf.Timeframe || "";
                    const squeezePercent = tf.squeezePercent || tf.SqueezePercent || 0;
                    const squeezeDuration = tf.squeezeDurationBars || tf.SqueezeDurationBars || 0;

                    let boxClass = isSqueezed ? "tf-box squeezed" : "tf-box";
                    let pctClass = isSqueezed ? "tf-pct low" : "tf-pct high";

                    let durationHtml = "";
                    if (squeezeDuration > 0) {
                        durationHtml = `<span class="tf-duration">⏳ ${squeezeDuration} Mumdur</span>`;
                    } else {
                        durationHtml = `<span style="font-size:10px; color:#363c4e;">-</span>`;
                    }

                    return `
                            <div class="${boxClass}">
                                <span class="tf-name">${timeframe}</span>
                                <span class="${pctClass}">%${squeezePercent}</span>
                                ${durationHtml}
                            </div>
                        `;
                }).join('');

                return `
                        <div class="squeeze-card">
                            <div class="card-header">
                                <div>
                                    <div class="card-title">${sym}</div>
                                    <div class="card-category">${nm}</div>
                                </div>
                                ${badgeHtml}
                            </div>

                            <div class="tf-grid">
                                ${tfBoxes}
                            </div>

                            <div class="card-action">
                                <a href="/index.html?symbol=${sym}" class="btn-trade">Grafikte İncele ➔</a>
                            </div>
                        </div>
                    `;
            }).join('');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderCards();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderCards);

        fetchSqueezeData();
        setInterval(fetchSqueezeData, 20000);
    </script>
</body>
</html>
